# Meilisearch und buchindex für den Server.
#
#   docker compose up -d                 startet Meilisearch
#   docker compose run --rm buchindex    führt einen Lauf aus (Standard: sync)
#
# Die Werte kommen aus der .env neben dieser Datei (siehe .env.example).

services:
  meilisearch:
    image: getmeili/meilisearch:v1.56.2
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:?MEILI_KEY fehlt in der .env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      # Begrenzt die Kerne, die Meilisearch beim Indexieren belegt.
      MEILI_MAX_INDEXING_THREADS: ${MEILI_MAX_INDEXING_THREADS:-2}
      # Meilisearch ruft den Embedding-Server für Suchanfragen auf und
      # blockiert interne Adressen, wenn sie hier nicht freigegeben sind.
      # Ein leerer Wert ist ungültig; der Standard ist eine Adresse, die es
      # in keinem Netz gibt, und gibt damit nichts frei.
      MEILI_EXPERIMENTAL_ALLOWED_IP_NETWORKS: ${MEILI_ALLOWED_IP_NETWORKS:-192.0.2.0/32}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "${MEILI_BIND:-127.0.0.1:7700}:7700"
    volumes:
      - meili_data:/meili_data

  buchindex:
    build: .
    # Kein Dauerdienst: startet nur über `docker compose run`.
    profiles: ["job"]
    depends_on:
      meilisearch:
        condition: service_healthy
    env_file: .env
    environment:
      # Pfade und Adresse im Container; überschreiben die Werte aus der .env.
      BOOKS_DIR: /books
      STATE_DB: /data/state.db
      WORK_DIR: /data/work
      MEILI_URL: http://meilisearch:7700
    volumes:
      - "${BOOKS_DIR:?BOOKS_DIR fehlt in der .env}:/books:ro"
      - buchindex_data:/data

volumes:
  meili_data:
  buchindex_data:
